apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab1-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ngchicuong8820/Lab_1.git' # THAY URL CỦA BẠN
    targetRevision: HEAD
    path: apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true